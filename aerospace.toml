# AeroSpace (i3-like tiling). Linked as ~/.config/aerospace/aerospace.toml
# Docs: https://nikitabobko.github.io/AeroSpace/guide
# Modifier is ctrl+alt (not plain alt) so it does not steal alt+b/alt+f from zsh in Ghostty
# (macos-option-as-alt = true) or the option key from accented characters.
#
# Each app goes to its own workspace (see on-window-detected) and every window uses the whole
# screen: the default layout is accordion (windows stacked, one visible at a time) with no gaps.
# ctrl+alt+/ splits the current workspace side by side when you want two windows at once.
config-version = 2

start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 0
default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'
automatically-unhide-macos-hidden-apps = false

key-mapping.preset = 'qwerty'

# The mouse follows focus when it moves to another monitor
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
  inner.horizontal = 0
  inner.vertical = 0
  outer.left = 0
  outer.bottom = 0
  outer.top = 0
  outer.right = 0

# 1 terminal/AI · 2 code · 3 browser · 4 chat/mail · 5 notes · 6 other
# Bundle ids: aerospace list-apps
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.apple.systempreferences'
  run = 'layout floating'
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.apple.finder'
  run = 'layout floating'

[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.mitchellh.ghostty'
  run = 'move-node-to-workspace 1'
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.anthropic.claudefordesktop'
  run = 'move-node-to-workspace 1'

[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.microsoft.VSCode'
  run = 'move-node-to-workspace 2'
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.google.android.studio'
  run = 'move-node-to-workspace 2'
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.apple.dt.Xcode'
  run = 'move-node-to-workspace 2'

[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.apple.Safari'
  run = 'move-node-to-workspace 3'
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.google.Chrome'
  run = 'move-node-to-workspace 3'

[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap'
  run = 'move-node-to-workspace 4'
[[on-window-detected]]
  if = 'test %{app-bundle-id} = net.whatsapp.WhatsApp'
  run = 'move-node-to-workspace 4'
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.gather.GatherV2'
  run = 'move-node-to-workspace 4'
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.apple.mail'
  run = 'move-node-to-workspace 4'

[[on-window-detected]]
  if = 'test %{app-bundle-id} = md.obsidian'
  run = 'move-node-to-workspace 5'
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.apple.Notes'
  run = 'move-node-to-workspace 5'

[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.electron.dockerdesktop'
  run = 'move-node-to-workspace 6'
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.apple.Music'
  run = 'move-node-to-workspace 6'

[mode.main.binding]
  ctrl-alt-enter = 'exec-and-forget open -na Ghostty'

  # Focus and move (vim keys). In accordion, h/l (or j/k) cycle through the stacked windows.
  # wrap-around: after the last window it goes back to the first
  ctrl-alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
  ctrl-alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
  ctrl-alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
  ctrl-alt-l = 'focus --boundaries-action wrap-around-the-workspace right'
  ctrl-alt-shift-h = 'move left'
  ctrl-alt-shift-j = 'move down'
  ctrl-alt-shift-k = 'move up'
  ctrl-alt-shift-l = 'move right'

  # Layout
  ctrl-alt-slash = 'layout tiles horizontal vertical'      # side by side
  ctrl-alt-comma = 'layout accordion horizontal vertical'  # back to full screen stack
  ctrl-alt-f = 'fullscreen'
  ctrl-alt-space = 'layout floating tiling'
  ctrl-alt-minus = 'resize smart -50'
  ctrl-alt-equal = 'resize smart +50'

  # Workspaces
  ctrl-alt-1 = 'workspace 1'
  ctrl-alt-2 = 'workspace 2'
  ctrl-alt-3 = 'workspace 3'
  ctrl-alt-4 = 'workspace 4'
  ctrl-alt-5 = 'workspace 5'
  ctrl-alt-6 = 'workspace 6'
  ctrl-alt-7 = 'workspace 7'
  ctrl-alt-8 = 'workspace 8'
  ctrl-alt-9 = 'workspace 9'
  ctrl-alt-shift-1 = 'move-node-to-workspace 1'
  ctrl-alt-shift-2 = 'move-node-to-workspace 2'
  ctrl-alt-shift-3 = 'move-node-to-workspace 3'
  ctrl-alt-shift-4 = 'move-node-to-workspace 4'
  ctrl-alt-shift-5 = 'move-node-to-workspace 5'
  ctrl-alt-shift-6 = 'move-node-to-workspace 6'
  ctrl-alt-shift-7 = 'move-node-to-workspace 7'
  ctrl-alt-shift-8 = 'move-node-to-workspace 8'
  ctrl-alt-shift-9 = 'move-node-to-workspace 9'
  ctrl-alt-tab = 'workspace-back-and-forth'
  ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

  ctrl-alt-r = 'mode resize'
  ctrl-alt-shift-semicolon = 'mode service'

# ctrl+alt+r, then h/l (width) and j/k (height); enter or esc leaves the mode.
# Resizing needs a neighbor: split first with ctrl+alt+/ (in accordion only one window is visible).
[mode.resize.binding]
  h = 'resize width -50'
  l = 'resize width +50'
  j = 'resize height +50'
  k = 'resize height -50'
  minus = 'resize smart -50'
  equal = 'resize smart +50'
  b = 'balance-sizes'
  enter = 'mode main'
  esc = 'mode main'

# ctrl+alt+shift+; then a key. esc leaves the mode.
[mode.service.binding]
  esc = ['reload-config', 'mode main']
  r = ['flatten-workspace-tree', 'mode main']   # reset the layout
  f = ['layout floating tiling', 'mode main']   # toggle floating/tiling
  backspace = ['close-all-windows-but-current', 'mode main']
  ctrl-alt-shift-h = ['join-with left', 'mode main']
  ctrl-alt-shift-j = ['join-with down', 'mode main']
  ctrl-alt-shift-k = ['join-with up', 'mode main']
  ctrl-alt-shift-l = ['join-with right', 'mode main']
