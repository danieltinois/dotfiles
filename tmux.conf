# tmux, tuned for running Claude Code and Codex in panes. Colors match ghostty.config (VS Code Dark+).
# Linked as ~/.config/tmux/tmux.conf. Reload a running server with: prefix + r

# --- Terminal ---
set -g default-terminal "tmux-256color"
set -as terminal-features "xterm*:RGB"
set -sg escape-time 10          # Esc reaches vim/agents right away
set -g focus-events on

# Claude Code: Shift+Enter inserts a newline, and notifications reach Ghostty.
# After changing these, detach, attach again and restart Claude Code.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

# --- Usability ---
set -g mouse on                 # click panes, drag borders, scroll with the trackpad
set -g history-limit 50000      # long agent output stays scrollable
set -g base-index 1             # windows start at 1, like the keyboard row
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on         # copied text goes to the macOS clipboard
setw -g mode-keys vi            # in copy mode (prefix + [): v selects, y copies, q leaves

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# New windows and splits open in the current pane's folder (the worktree you are in).
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Look ---
set -g status-style "bg=#1E1E1E,fg=#D4D4D4"
set -g status-left "#[bg=#569CD6,fg=#181818,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#808080]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#4EC9B0,fg=#181818,bold] #I:#W "
setw -g window-status-activity-style "fg=#DCDCAA"
setw -g monitor-activity on     # a window turns yellow when an agent prints something there
set -g visual-activity off
set -g pane-border-style "fg=#3C3C3C"
set -g pane-active-border-style "fg=#569CD6"
set -g message-style "bg=#264F78,fg=#FFFFFF"
setw -g mode-style "bg=#264F78,fg=#FFFFFF"
